baseURL = "https://stefangruehn.github.io/"
title = "Stefan Grühn"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

# Shared params — per-language overrides live under [languages.xx.params]
[params]
  env = "production"
  title = "Stefan Grühn"
  author = "Stefan Grühn"
  defaultTheme = "auto"
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = false
  hidemeta = false
  hideSummary = false
  showtoc = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/stefangruehn"

  [[params.socialIcons]]
    name = "rss"
    url = "posts/index.xml"

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    title = "Stefan Grühn"

    [languages.en.params]
      description = "Notes on software, systems, and whatever I'm building."
      keywords = ["blog", "software", "engineering"]
      DateFormat = "January 2, 2006"

      [languages.en.params.homeInfoParams]
        Title = "Hi there 👋"
        Content = "Welcome to my blog. I write about software, systems, and side projects."

    [languages.en.menus]

      [[languages.en.menus.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 10

      [[languages.en.menus.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 20

      [[languages.en.menus.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 30

      [[languages.en.menus.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 40

  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 2
    title = "Stefan Grühn"

    [languages.de.params]
      description = "Notizen zu Software, Systemen und dem, woran ich gerade baue."
      keywords = ["Blog", "Software", "Softwareentwicklung"]
      DateFormat = "2. January 2006"

      [languages.de.params.homeInfoParams]
        Title = "Hallo 👋"
        Content = "Willkommen auf meinem Blog. Ich schreibe über Software, Systeme und Nebenprojekte."

    [languages.de.menus]

      [[languages.de.menus.main]]
        identifier = "posts"
        name = "Beiträge"
        url = "/posts/"
        weight = 10

      [[languages.de.menus.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 20

      [[languages.de.menus.main]]
        identifier = "search"
        name = "Suche"
        url = "/search/"
        weight = 30

      [[languages.de.menus.main]]
        identifier = "about"
        name = "Über mich"
        url = "/about/"
        weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = "monokai"
