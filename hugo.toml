baseURL = "https://stefangruehn.github.io/"
title = "Stefan Grühn"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
enableGitInfo = true
buildFuture = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

# Shared params — per-language overrides live under [languages.xx.params]
[params]
  env = "production"
  title = "Stefan Grühn"
  author = "Stefan Grühn"
  defaultTheme = "auto"
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = false
  hidemeta = false
  hideSummary = false
  showtoc = true

  # Zaehlpixel-Endpunkt; leeren, um die Statistik abzuschalten.
  goatcounter = "https://stefangruehn.goatcounter.com/count"

  # Kommentare via GitHub Discussions. IDs stammen aus der GitHub-API,
  # Kategorie "Announcements": dort kann nur giscus selbst Threads anlegen.
  [params.giscus]
    repo = "stefangruehn/stefangruehn.github.io"
    repoId = "R_kgDOUJUXvg"
    category = "Announcements"
    categoryId = "DIC_kwDOUJUXvs4DEtBd"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/stefangruehn"

  [[params.socialIcons]]
    name = "rss"
    url = "posts/index.xml"

  # Ohne sameAs uebernimmt das Theme alle socialIcons — dann landet der
  # RSS-Feed im Feld fuer Profile, wo er nicht hingehoert.
  [params.schema]
    publisherType = "Person"
    sameAs = ["https://github.com/stefangruehn"]

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    title = "Stefan Grühn"

    [languages.en.params]
      description = "Notes on software, systems, and whatever I'm building."
      keywords = ["blog", "software", "engineering"]
      DateFormat = "January 2, 2006"

      # Fusszeilen-Link. Absoluter Pfad, weil der Text auf jeder Seite
      # steht und ein relativer Link auf Unterseiten ins Leere liefe.
      [languages.en.params.footer]
        text = "[Legal notice](/imprint/) · [Privacy](/privacy/)"

      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm Stefan."
        Content = """
I work as a software engineer and data analyst, and I write here about how I use AI in my daily work — mostly in my open-source projects on GitHub.

Every post here is written with [Claude Code](https://claude.com/claude-code), and the commands, measurements and numbers come from real sessions on my own machines.
[More about me and my tools](about/).
"""

    [languages.en.menus]

      [[languages.en.menus.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 10

      [[languages.en.menus.main]]
        identifier = "series"
        name = "Series"
        url = "/series/"
        weight = 15

      [[languages.en.menus.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 20

      [[languages.en.menus.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 30

      [[languages.en.menus.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 40

  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 2
    title = "Stefan Grühn"

    [languages.de.params]
      description = "Notizen zu Software, Systemen und dem, woran ich gerade baue."
      keywords = ["Blog", "Software", "Softwareentwicklung"]
      DateFormat = "2. January 2006"

      # Fusszeilen-Link. Absoluter Pfad, weil der Text auf jeder Seite
      # steht und ein relativer Link auf Unterseiten ins Leere liefe.
      [languages.de.params.footer]
        text = "[Impressum](/de/imprint/) · [Datenschutz](/de/privacy/)"

      [languages.de.params.homeInfoParams]
        Title = "Hallo, ich bin Stefan."
        Content = """
Ich arbeite als Softwareingenieur und Datenanalyst und schreibe hier darüber, wie ich KI in meiner täglichen Arbeit einsetze — vor allem in meinen Open-Source-Projekten auf GitHub.

Jeder Beitrag hier entsteht mit [Claude Code](https://claude.com/claude-code), und die Befehle, Messungen und Zahlen stammen aus echten Sitzungen auf meinen eigenen Rechnern.
[Mehr über mich und meine Werkzeuge](about/).
"""

    [languages.de.menus]

      [[languages.de.menus.main]]
        identifier = "posts"
        name = "Beiträge"
        url = "/posts/"
        weight = 10

      [[languages.de.menus.main]]
        identifier = "series"
        name = "Serien"
        url = "/series/"
        weight = 15

      [[languages.de.menus.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 20

      [[languages.de.menus.main]]
        identifier = "search"
        name = "Suche"
        url = "/search/"
        weight = 30

      [[languages.de.menus.main]]
        identifier = "about"
        name = "Über mich"
        url = "/about/"
        weight = 40

# Nur Tags und Serien. Ohne diesen Block legt Hugo zusaetzlich leere
# categories-Seiten und -Feeds an, die Suchmaschinen indexieren.
# series traegt die mehrteiligen Beitragsfolgen; die Begriffsseite ist
# zugleich die Uebersichtsseite der Serie. Pro Sprache ein eigener Begriff
# (DE "Nachhall", EN "Reverberations"), Hugo haelt sie getrennt.
[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = "monokai"
